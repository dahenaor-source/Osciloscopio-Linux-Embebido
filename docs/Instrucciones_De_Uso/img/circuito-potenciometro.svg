<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker>
  </defs>
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">Circuito de prueba: potenciómetro → ESP32-C6 (canal A)</text>

  <rect x="640" y="60" width="220" height="300" rx="12" fill="#fdf0e3" stroke="#c4600a" stroke-width="2.5"/>
  <text x="750" y="88" text-anchor="middle" font-size="17" font-weight="bold" fill="#c4600a">ESP32-C6-DevKitC-1</text>
  <circle cx="640" cy="130" r="5" fill="#c00"/>
  <text x="652" y="135" font-size="14" font-weight="bold">3V3</text>
  <circle cx="640" cy="210" r="5" fill="#4361ee"/>
  <text x="652" y="215" font-size="14" font-weight="bold">GPIO0 (canal A)</text>
  <circle cx="640" cy="270" r="5" fill="#e08a00"/>
  <text x="652" y="275" font-size="14" font-weight="bold">GPIO1 (canal B)</text>
  <circle cx="640" cy="330" r="5" fill="#111"/>
  <text x="652" y="335" font-size="14" font-weight="bold">GND (G)</text>

  <rect x="270" y="150" width="40" height="160" fill="#fff" stroke="#333" stroke-width="2.5"/>
  <text x="290" y="235" text-anchor="middle" font-size="13" transform="rotate(-90 290 235)">10 kΩ</text>
  <text x="60" y="112" font-size="14" font-weight="bold">Potenciómetro</text>
  <text x="60" y="140" font-size="12" fill="#555">Extremo 1 (arriba)</text>
  <text x="60" y="330" font-size="12" fill="#555">Extremo 3 (abajo)</text>
  <text x="330" y="262" font-size="12" fill="#555">Cursor (pin central)</text>

  <polyline points="290,150 290,130 640,130" fill="none" stroke="#c00" stroke-width="3"/>
  <text x="460" y="122" text-anchor="middle" font-size="12" fill="#c00">3,3 V (solo para el potenciómetro)</text>
  <polyline points="290,310 290,330 640,330" fill="none" stroke="#111" stroke-width="3"/>
  <text x="420" y="350" text-anchor="middle" font-size="12" fill="#111">GND</text>

  <line x1="390" y1="236" x2="312" y2="236" stroke="#333" stroke-width="3" marker-end="url(#a)"/>
  <polyline points="390,236 390,210 430,210" fill="none" stroke="#4361ee" stroke-width="3"/>
  <rect x="430" y="196" width="80" height="28" fill="#fff" stroke="#333" stroke-width="2.5"/>
  <text x="470" y="215" text-anchor="middle" font-size="13">1 kΩ</text>
  <line x1="510" y1="210" x2="640" y2="210" stroke="#4361ee" stroke-width="3"/>

  <circle cx="570" cy="210" r="4" fill="#4361ee"/>
  <line x1="570" y1="210" x2="570" y2="262" stroke="#4361ee" stroke-width="3"/>
  <line x1="550" y1="262" x2="590" y2="262" stroke="#333" stroke-width="3"/>
  <line x1="550" y1="274" x2="590" y2="274" stroke="#333" stroke-width="3"/>
  <line x1="570" y1="274" x2="570" y2="330" stroke="#111" stroke-width="3"/>
  <circle cx="570" cy="330" r="4" fill="#111"/>
  <text x="520" y="272" text-anchor="end" font-size="12" fill="#555">100 nF</text>

  <polyline points="640,270 612,270 612,330" fill="none" stroke="#e08a00" stroke-width="3"/>
  <circle cx="612" cy="330" r="4" fill="#111"/>

  <text x="450" y="392" text-anchor="middle" font-size="13" fill="#444">Canal B a GND = lee 0 V (si no usas un segundo potenciómetro). Nunca conectes más de 3,3 V a un pin.</text>
</svg>
