<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="r" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker>
  </defs>
  <rect width="900" height="380" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">Entradas analógicas: generador de señales → ESP32-C6</text>

  <rect x="40" y="65" width="230" height="250" rx="12" fill="#eef7ee" stroke="#2d7a2d" stroke-width="2.5"/>
  <text x="155" y="95" text-anchor="middle" font-size="17" font-weight="bold" fill="#2d7a2d">Generador de señales</text>
  <text x="155" y="115" text-anchor="middle" font-size="13" fill="#2d7a2d">0 a 3,1 V, solo positivo</text>
  <text x="60" y="175" font-size="15" font-weight="bold">Salida 1</text>
  <text x="60" y="245" font-size="15" font-weight="bold">Salida 2</text>
  <text x="60" y="296" font-size="15" font-weight="bold">Tierra (GND)</text>

  <rect x="390" y="156" width="80" height="28" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="430" y="175" text-anchor="middle" font-size="13">1 kΩ</text>
  <rect x="390" y="226" width="80" height="28" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="430" y="245" text-anchor="middle" font-size="13">1 kΩ</text>

  <line x1="270" y1="170" x2="390" y2="170" stroke="#4361ee" stroke-width="3"/>
  <line x1="470" y1="170" x2="610" y2="170" stroke="#4361ee" stroke-width="3" marker-end="url(#r)"/>
  <line x1="270" y1="240" x2="390" y2="240" stroke="#e08a00" stroke-width="3"/>
  <line x1="470" y1="240" x2="610" y2="240" stroke="#e08a00" stroke-width="3" marker-end="url(#r)"/>
  <line x1="270" y1="291" x2="610" y2="291" stroke="#111" stroke-width="4"/>
  <text x="330" y="160" text-anchor="middle" font-size="12" fill="#555">Canal A</text>
  <text x="330" y="230" text-anchor="middle" font-size="12" fill="#555">Canal B</text>
  <text x="440" y="283" text-anchor="middle" font-size="12" fill="#555">Tierra común</text>
  <text x="430" y="205" text-anchor="middle" font-size="11" fill="#777">(resistencia opcional)</text>

  <rect x="610" y="65" width="250" height="250" rx="12" fill="#fdf0e3" stroke="#c4600a" stroke-width="2.5"/>
  <text x="735" y="95" text-anchor="middle" font-size="17" font-weight="bold" fill="#c4600a">ESP32-C6-DevKitC-1</text>
  <text x="735" y="115" text-anchor="middle" font-size="13" fill="#c4600a">ADC1, 12 bits</text>
  <text x="630" y="165" font-size="15" font-weight="bold">GPIO0</text><text x="630" y="183" font-size="12" fill="#555">ADC1_CH0 (CH A)</text>
  <text x="630" y="235" font-size="15" font-weight="bold">GPIO1</text><text x="630" y="253" font-size="12" fill="#555">ADC1_CH1 (CH B)</text>
  <text x="630" y="297" font-size="15" font-weight="bold">GND</text>

  <rect x="40" y="335" width="820" height="32" rx="6" fill="#fff3cd" stroke="#e0a800"/>
  <text x="450" y="356" text-anchor="middle" font-size="13" fill="#7a5b00">⚠ Máximo 3,3 V y nunca negativo: configure el offset del generador antes de conectar.</text>
</svg>
